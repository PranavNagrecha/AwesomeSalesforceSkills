[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfskills-mcp"
# Bumped at the end of each Tier; see src/sfskills_mcp/__init__.py for history.
version = "0.4.7"
description = "Model Context Protocol server exposing the SfSkills Salesforce skill library, agent + decision-tree corpus, and live Salesforce org metadata."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pranav Nagrecha" }]
license = { text = "MIT" }
keywords = [
  "salesforce", "mcp", "model-context-protocol", "ai", "sfskills",
  "salesforce-cli", "apex", "lwc", "flow", "agentforce",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Code Generators",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  # Bounded on BOTH ends; both bounds were measured, not guessed (2026-08-01).
  #
  # Floor 1.7.0 — `from mcp.types import ToolAnnotations` raises ImportError on
  #   1.4.0 / 1.5.0 / 1.6.0. 1.7.0 is the first release where `import
  #   sfskills_mcp.server` succeeds. (An earlier comment here claimed
  #   ToolAnnotations landed in 1.4; that was wrong and made the floor useless.)
  # Ceiling <2.0 — mcp 2.0.0 removed `mcp.server.fastmcp` entirely (server.py:64
  #   imports Context and FastMCP from it), so an unbounded spec resolved to
  #   2.0.0 and every fresh `pip install sfskills-mcp` died with
  #   ModuleNotFoundError: No module named 'mcp.server.fastmcp'.
  #   Lifting this ceiling is a port to mcp.server.mcpserver, not a pin bump.
  #
  # Tested good: 1.7.0, 1.7.1, 1.8.0, 1.10.0, 1.29.0 (newest 1.x on PyPI).
  "mcp>=1.7.0,<2.0",
  # Schema validation for emit_envelope output (v0.4.4+).
  # Soft dependency: if jsonschema is absent, emit_envelope skips schema
  # validation rather than crashing — same fallback pattern as fastembed.
  "jsonschema>=4.0,<5.0",
  "referencing>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "build>=1.0",
  "twine>=4.0",
]
# Semantic-embedding extras. Without these, the MCP server runs fine but
# retrieval is lexical-only (no vector-score boost). Install with
# `pip install sfskills-mcp[embeddings]`. ~700 MB once the model is
# downloaded by huggingface_hub on first use.
embeddings = [
  "fastembed>=0.4,<1.0",
]

[project.urls]
"Homepage" = "https://github.com/PranavNagrecha/AwesomeSalesforceSkills"
"Repository" = "https://github.com/PranavNagrecha/AwesomeSalesforceSkills"
"Documentation" = "https://github.com/PranavNagrecha/AwesomeSalesforceSkills/blob/main/mcp/sfskills-mcp/README.md"
"Issues" = "https://github.com/PranavNagrecha/AwesomeSalesforceSkills/issues"
"Connect Recipes" = "https://github.com/PranavNagrecha/AwesomeSalesforceSkills/blob/main/mcp/sfskills-mcp/docs/CONNECT.md"

[project.scripts]
sfskills-mcp = "sfskills_mcp.__main__:main"
sfskills-mcp-init = "sfskills_mcp.init:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sfskills_mcp = ["py.typed"]
