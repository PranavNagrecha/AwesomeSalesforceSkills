name: Publish sfskills-mcp

# Triggered by either:
#   - A version tag matching mcp-v*  (typical release flow)
#   - Manual dispatch from the Actions tab (TestPyPI dry-run, hot-fixes)
#
# Two-stage flow:
#   1. ``build``  — wheel + sdist + the data-bundle tarball that
#      sfskills-mcp-init downloads. Runs on every trigger.
#   2. ``publish-data`` — uploads sfskills-data.tar.gz to the GitHub Release.
#   3. ``publish-pypi`` — uploads the wheel to PyPI (or TestPyPI for dispatch).
#
# Secrets required in the repo:
#   - PYPI_API_TOKEN     (production publish; scoped to project sfskills-mcp)
#   - TEST_PYPI_API_TOKEN (test publish; scoped to project sfskills-mcp)
#
# STATUS 2026-08-15: NEITHER SECRET IS CONFIGURED. `gh secret list` returns
# nothing, so the `publish-pypi` job below WILL fail on any tag push with a
# twine authentication error. `build` and `publish-data` do not need them —
# publish-data uses the automatic GITHUB_TOKEN — so tagging still produces a
# working GitHub Release; only the PyPI upload is blocked. This job is left
# failing rather than skipped on purpose: a release that cannot reach PyPI
# should be loud, not silently green. Add the token in
# Settings > Secrets and variables > Actions to clear it.
#
# Note this workflow has never executed: PyPI shows a single release (0.4.6),
# published by hand, and `gh run list --workflow=publish-mcp.yml` is empty.

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target index"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: write   # needed to upload data tarball to the release
  id-token: write   # for trusted-publishing if you flip to OIDC later

jobs:
  build:
    name: Build wheel + data bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build wheel + sdist
        working-directory: mcp/sfskills-mcp
        run: python -m build

      # The bundle step below is NAMED "lexical index" but a fresh checkout has
      # no index to copy: vector_index/ is gitignored except for 3 small JSON
      # files (manifest, query-fixtures, query-variants). Without this step the
      # tarball shipped no lexical.sqlite and no chunks.jsonl, so an install
      # bootstrapped by `sfskills-mcp-init` answered "Coverage: NONE" for every
      # query. Build it here, exactly as validate.yml already does.
      # Adds ~300 MB to the release asset (chunks.jsonl ~127 MB +
      # lexical.sqlite ~169 MB); embeddings are NOT built and stay excluded.
      - name: Install repo tooling (needed to build the index)
        run: python -m pip install -r requirements.txt

      - name: Build lexical retrieval index
        run: python3 scripts/build_index.py

      - name: Build data bundle (registry + lexical index + agents + templates + decision-trees)
        run: |
          mkdir -p _bundle/sfskills-data
          # Mirror the layout the server expects under SFSKILLS_REPO_ROOT.
          cp -r registry _bundle/sfskills-data/
          cp -r vector_index _bundle/sfskills-data/
          cp -r agents _bundle/sfskills-data/
          cp -r skills _bundle/sfskills-data/
          cp -r templates _bundle/sfskills-data/
          cp -r standards _bundle/sfskills-data/
          cp -r commands _bundle/sfskills-data/
          tar -czf sfskills-data.tar.gz -C _bundle sfskills-data
          ls -lh sfskills-data.tar.gz

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sfskills-mcp-dist
          path: |
            mcp/sfskills-mcp/dist/*
            sfskills-data.tar.gz

  publish-data:
    name: Attach data bundle to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sfskills-mcp-dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sfskills-data.tar.gz
            mcp/sfskills-mcp/dist/*

  publish-pypi:
    name: Publish wheel to PyPI / TestPyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sfskills-mcp-dist
          path: artefacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository-url https://test.pypi.org/legacy/ \
            artefacts/mcp/sfskills-mcp/dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/mcp-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload artefacts/mcp/sfskills-mcp/dist/*
