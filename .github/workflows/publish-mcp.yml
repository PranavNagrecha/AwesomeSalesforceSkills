name: Publish sfskills-mcp

# Triggered by either:
#   - A version tag matching mcp-v*  (typical release flow)
#   - Manual dispatch from the Actions tab (TestPyPI dry-run, hot-fixes)
#
# Two-stage flow:
#   1. ``build``  — wheel + sdist + the data-bundle tarball that
#      sfskills-mcp-init downloads. Runs on every trigger.
#   2. ``publish-data`` — uploads sfskills-data.tar.gz to the GitHub Release.
#   3. ``publish-pypi`` — uploads the wheel to PyPI (or TestPyPI for dispatch).
#
# Secrets required in the repo:
#   - PYPI_API_TOKEN     (production publish; scoped to project sfskills-mcp)
#   - TEST_PYPI_API_TOKEN (test publish; scoped to project sfskills-mcp)
#
# STATUS 2026-08-15: NO SECRETS ARE CONFIGURED (`gh secret list` is empty), so
# publish-pypi NO LONGER USES ONE. It was switched to PyPI Trusted Publishing
# (OIDC) after the mcp-v0.4.7 tag run failed with `TWINE_PASSWORD:` empty and a
# 403 from upload.pypi.org. See the publish-pypi job for the one-time PyPI-side
# setup that is still required; until it is done, that job fails with an
# explicit "not a trusted publisher" message.
#
# `build` and `publish-data` need no secrets at all — publish-data uses the
# automatic GITHUB_TOKEN — so tagging produces a working GitHub Release
# regardless. The 0.4.7 release published successfully that way.
#
# The two *_API_TOKEN secrets above are now optional fallbacks, not
# requirements; nothing reads them unless you add a `password:` input back.
#
# History: this workflow first executed on 2026-08-15 for mcp-v0.4.7. PyPI's
# only release before that was 0.4.6, uploaded by hand.

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target index"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: write   # needed to upload data tarball to the release
  id-token: write   # for trusted-publishing if you flip to OIDC later

jobs:
  build:
    name: Build wheel + data bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo tooling (needed to build the index)
        run: python -m pip install -r requirements.txt

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build lexical retrieval index without mutating tracked files
        run: |
          python3 scripts/bootstrap.py --skip-commands
          git diff --exit-code

      - name: Build wheel + sdist
        working-directory: mcp/sfskills-mcp
        run: python -m build

      - name: Twine check
        run: python -m twine check mcp/sfskills-mcp/dist/*

      - name: Smoke-install the wheel
        run: |
          python -m venv /tmp/sfskills-mcp-wheel-smoke
          /tmp/sfskills-mcp-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/sfskills-mcp-wheel-smoke/bin/python -m pip install mcp/sfskills-mcp/dist/*.whl
          /tmp/sfskills-mcp-wheel-smoke/bin/python -c "import sfskills_mcp, sys; print(sfskills_mcp.__version__); sys.exit(0)"

      - name: Build data bundle (registry + lexical index + agents + templates + decision-trees)
        run: |
          mkdir -p _bundle/sfskills-data
          # Mirror the layout the server expects under SFSKILLS_REPO_ROOT.
          cp -r registry _bundle/sfskills-data/
          cp -r vector_index _bundle/sfskills-data/
          cp -r agents _bundle/sfskills-data/
          cp -r skills _bundle/sfskills-data/
          cp -r templates _bundle/sfskills-data/
          cp -r standards _bundle/sfskills-data/
          cp -r commands _bundle/sfskills-data/
          tar -czf sfskills-data.tar.gz -C _bundle sfskills-data
          ls -lh sfskills-data.tar.gz

      - name: Generate SHA256SUMS.txt
        run: |
          shasum -a 256 \
            mcp/sfskills-mcp/dist/*.whl \
            mcp/sfskills-mcp/dist/*.tar.gz \
            sfskills-data.tar.gz \
            | sed 's# .*/# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sfskills-mcp-dist
          path: |
            mcp/sfskills-mcp/dist/*
            sfskills-data.tar.gz
            SHA256SUMS.txt

  publish-data:
    name: Attach data bundle to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sfskills-mcp-dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sfskills-data.tar.gz
            mcp/sfskills-mcp/dist/*
            SHA256SUMS.txt

  publish-pypi:
    name: Publish wheel to PyPI / TestPyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sfskills-mcp-dist
          path: artefacts

      # The dist/ files land under artefacts/mcp/sfskills-mcp/dist/ because the
      # build job uploaded them with that path prefix. The publish action wants
      # a flat directory, so collect them first.
      - name: Collect distributions
        run: |
          mkdir -p dist
          cp artefacts/mcp/sfskills-mcp/dist/* dist/
          ls -l dist/

      # Trusted Publishing (OIDC) — no API token anywhere. The 0.4.7 tag run
      # failed with `TWINE_PASSWORD:` empty and a 403 from PyPI, because no
      # PYPI_API_TOKEN secret exists on this repo and adding one is a manual
      # step. Trusted Publishing removes the secret entirely: PyPI verifies the
      # short-lived OIDC token GitHub mints for this exact repo + workflow.
      #
      # ONE-TIME SETUP, on PyPI, required before this can succeed:
      #   pypi.org -> project `sfskills-mcp` -> Publishing -> Add a new publisher
      #     Owner:       PranavNagrecha
      #     Repository:  AwesomeSalesforceSkills
      #     Workflow:    publish-mcp.yml
      #     Environment: (leave blank)
      # Until that publisher exists this step fails with an explicit
      # "not a trusted publisher" message rather than a bare 403.
      #
      # `password` is deliberately omitted: the action uses OIDC when no
      # password is given. If you would rather use a classic API token, set the
      # PYPI_API_TOKEN secret and add `password: ${{ secrets.PYPI_API_TOKEN }}`
      # to the step below — both paths work, they are alternatives.
      - name: Publish to TestPyPI (trusted publishing)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      # skip-existing keeps a re-run idempotent: PyPI refuses to replace a
      # version that already exists, and without this a retry after a partial
      # upload fails on the file that did land.
      - name: Publish to PyPI (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/mcp-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
