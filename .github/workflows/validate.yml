name: validate

# Wave-1 CI: matrix-shards validate_repo.py 4-way so 686+ skills validate in
# ~40 seconds wall-clock instead of 16+ minutes sequential. Runs on every PR
# targeting main and on every push to main. See docs/agents.md for the shard
# strategy (stable hash mod M, composable with --domain and --changed-only).

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  # -----------------------------------------------------------------------
  # Skill validation — fan out 4-way. Each shard validates ~1/4 of the repo
  # (hash-based partitioning is stable, so the same skill lands in the same
  # shard every run).
  # -----------------------------------------------------------------------
  validate-skills:
    name: skills (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: python3 -m pip install -r requirements.txt

      # lexical.sqlite is gitignored (> 50 MB, past GitHub's file limit).
      # Every CI run rebuilds it from the committed chunks. This also primes
      # the drift-check state machine so the shard validation stays green.
      - name: build local retrieval index
        run: python3 scripts/build_index.py

      # Retrieval-quality gate: ENABLED. It used to be skipped here "for
      # WAVE 1.1 only", pending a Wave 6 re-enable that never happened — so
      # the 1,356-fixture gate ran in zero CI jobs and zero hooks while the
      # comment claimed it was temporary.
      #
      # Measured before re-enabling (full local sweep, 2026-08-01): 1,356
      # fixtures, 1 failure, 99.93% pass, ~244s single-process => ~61s per
      # shard here. The old comment's "~40 shallow skills fail" estimate was
      # stale by an order of magnitude.
      #
      # RESOLVED 2026-08-14. The known failure at re-enable time was the query
      # `translate omniscript` not returning `omnistudio/omnistudio-multi-language`
      # in its top 3. It now ranks #1 at 1.499, clear of the runner-up
      # (`admin/multi-language-and-translation`, 0.570) — re-check with
      # `python3 scripts/search_knowledge.py "translate omniscript"`.
      #
      # The standing rule that fixed it still applies: when a fixture fails,
      # fix the ranking or that skill's triggers — do NOT re-add the skip flag
      # to make the shard green.
      #
      # .githooks/pre-push deliberately keeps the skip: it runs all 4 shards
      # sequentially, so the fixtures would add ~4 minutes to every push.
      # CI absorbs the cost in parallel instead.
      - name: validate shard ${{ matrix.shard }}
        run: python3 scripts/validate_repo.py --skills-only --shard ${{ matrix.shard }}/4

  # -----------------------------------------------------------------------
  # Agent validation — 76 agents validate in ~1 second; not worth sharding.
  # Wave 6: matrixed on ubuntu + macos so cross-OS hash drift in the
  # frontmatter round-trip or export parity tests surfaces here before it
  # poisons the manifest baseline downstream.
  # -----------------------------------------------------------------------
  validate-agents:
    name: agents (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: python3 -m pip install -r requirements.txt

      - name: validate agents
        run: python3 scripts/validate_repo.py --agents

      # The plugin artifacts under .claude/skills/ and .claude/agents/ are
      # GENERATED from registry/skills.json, and they are the surface that
      # actually routes on a fresh install — vector_index/ is gitignored, so
      # most installs have no search index and the roster glosses are the
      # whole lookup path. Until now nothing checked them: `build_plugin.py
      # --check` appeared in no workflow and no hook, so a skill description
      # could change while its shipped gloss silently did not. Cheap (no index
      # build, no network) and it fails on any drift.
      - name: plugin roster drift (build_plugin.py --check)
        run: python3 scripts/build_plugin.py --check

      - name: frontmatter round-trip test
        working-directory: mcp/sfskills-mcp
        run: python3 -m unittest tests.test_agent_frontmatter -v

      # Wave-2 probe input-validation tests. Runs without the mcp package
      # (TestProbeInputValidation) + with it (TestMCPServerRegistration,
      # skipped if mcp not installed — install -e is done separately for
      # the registration test).
      - name: probe + mcp tool tests
        working-directory: mcp/sfskills-mcp
        run: |
          python3 -m pip install -e . --quiet
          python3 -m unittest tests.test_tools -v

  # -----------------------------------------------------------------------
  # Export parity matrix — Wave 6. Runs the deterministic-export tests and
  # the manifest check on both ubuntu-latest and macos-latest to catch any
  # path-handling regression in stable_hash_for_files (the Wave 1.1 hotfix
  # that made hashes cross-OS stable). If this job diverges between OSes,
  # the multi-AI parity contract is broken and the PR must not merge.
  # -----------------------------------------------------------------------
  export-parity-matrix:
    name: export parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: python3 -m pip install -r requirements.txt

      # Must run before --check so the lexical.sqlite drift check is clean.
      - name: build local retrieval index
        run: python3 scripts/build_index.py

      - name: export_skills.py --check (cross-OS determinism)
        run: python3 scripts/export_skills.py --check

      - name: export parity unittests
        working-directory: mcp/sfskills-mcp
        run: python3 -m unittest tests.test_export_parity -v

  # -----------------------------------------------------------------------
  # Bench — verifies the sharded orchestration hasn't regressed past the
  # 30-second threshold on 500 synthetic skills. Runs on PRs that touch
  # scripts/validate_repo.py or pipelines/ (cheap gate; full bench takes
  # <15 seconds).
  # -----------------------------------------------------------------------
  bench-orchestration:
    name: bench (500 synthetic skills)
    runs-on: ubuntu-latest
    # Only run on PRs that actually touch the validator or its workers.
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.labels), 'validator') ||
      contains(github.event.pull_request.title, 'validate')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: python3 -m pip install -r requirements.txt

      - name: bench 500 skills under 30s
        run: python3 scripts/validate_repo_bench.py --count 500 --threshold 30

  # -----------------------------------------------------------------------
  # Eval structure lint — the golden P0 cases (10 flagship skills x 3 = 30)
  # and the agent baseline fixtures (53). Before this job they gated nothing:
  # `grep -rn "run_evals\|evals/" .github/workflows/ .githooks/` returned no
  # hits, so a malformed or truncated eval file could sit in the repo
  # indefinitely and the "flagship skills are eval-covered" claim was
  # unenforced.
  #
  # `--structure` is a lint, not a model run — no API key, no network, ~0.3s
  # for both runners combined (measured 2026-08-01: 0.1s + 0.2s).
  # -----------------------------------------------------------------------
  evals:
    name: eval structure lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: python3 -m pip install -r requirements.txt

      - name: golden eval structure (evals/golden/)
        run: python3 evals/scripts/run_evals.py --structure

      - name: agent eval structure (evals/agents/)
        run: python3 evals/agents/scripts/run_agent_evals.py --structure

  # -----------------------------------------------------------------------
  # MCP server — FULL test suite.
  #
  # Only 3 of 24 test modules used to run in CI (test_agent_frontmatter,
  # test_tools, test_export_parity = 15 of 248 tests), so 233 tests never
  # gated a merge — including both security modules for a server that talks
  # to live orgs:
  #   tests/test_tooling_query_blocklist.py  (14) — SOQL/Tooling DML blocklist
  #   tests/test_sf_cli_redaction.py         (20) — secret redaction
  #
  # Measured 2026-08-01 against a clean HEAD tree: 248 tests, ~113s, 0 skips.
  # No org, no credentials and no network are required — the org-touching
  # modules (test_dev_org 29, test_sf_cli 4) are hermetic: test_dev_org
  # patches `dev_org._run_soql` with unittest.mock, test_sf_cli points
  # SFSKILLS_SF_BIN at a generated stub script. Nothing here needs an
  # explicit org-gated skip. Live-org probes stay in
  # .github/workflows/org-validation.yml, which is manual/cron and needs
  # SFDX_AUTH_URL.
  #
  # The discovery form is load-bearing: `-t .` raises "Start directory is not
  # importable" (tests/ has no __init__.py) and `-s . -p 'test_*.py'`
  # discovers 0 tests while still exiting 0. Use `-s tests -t tests`.
  # -----------------------------------------------------------------------
  mcp-tests:
    name: mcp server (full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: python3 -m pip install -r requirements.txt

      # tests/test_skills.py asserts real retrieval results (has_coverage for
      # "trigger recursion") and lexical.sqlite is gitignored, so the index
      # has to exist before the suite runs.
      - name: build local retrieval index
        run: python3 scripts/build_index.py

      # Installs the mcp SDK so the server-registration tests execute instead
      # of raising SkipTest.
      #
      # PREREQUISITE, not a fact about HEAD: this step requires the
      # `mcp>=1.7.0,<2.0` ceiling in mcp/sfskills-mcp/pyproject.toml (added
      # alongside this workflow change; HEAD still carries an unbounded
      # `mcp>=1.4.0`). Without that ceiling pip resolves mcp 2.0.0, which
      # removed `mcp.server.fastmcp`, and this job dies at import with
      # ModuleNotFoundError instead of skipping. Land the two together.
      - name: install sfskills-mcp
        working-directory: mcp/sfskills-mcp
        run: python3 -m pip install -e . --quiet

      - name: full mcp test suite (248 tests, 24 modules)
        working-directory: mcp/sfskills-mcp
        run: python3 -m unittest discover -s tests -t tests -v
