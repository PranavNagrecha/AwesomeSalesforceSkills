<h1>X200 Modem: Firmware Reset</h1>
<p>Use these steps when the X200 shows a red status light.</p>
<h2>Before You Start</h2>
<ul><li>Keep the modem powered.</li><li>Have the admin password ready.</li></ul>
<h2>Reset Steps</h2>
<ol><li>Hold the reset button for 10 seconds.</li><li>Wait for the green light.</li></ol>
