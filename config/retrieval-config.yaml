version: 1

embeddings:
  # Real semantic embeddings via fastembed (BAAI/bge-small-en-v1.5, 384-dim,
  # MIT, ONNX-q on CPU) are wired and tested but currently disabled by default
  # because the 126K-chunk full-repo encode takes ~25-40 minutes on M-series
  # CPUs and risks colliding with the pre-commit hook (which also runs
  # skill_sync). To enable + benchmark:
  #   1. Set enabled: true below.
  #   2. Run python3 scripts/build_index.py from a fresh terminal — this
  #      writes vector_index/embeddings.jsonl (~290 MB).
  #   3. Re-run python3 evals/measurement/retrieval_eval.py against
  #      vector_index/query-fixtures.json (must hold ≥98%) and against the
  #      NL fixture (target ≥85%). Compare to baseline 98.6% / 74.3%.
  #   4. If both gates pass, this comment can be inverted (default to true).
  #
  # The 1,418-query NL audit on 2026-05-09 showed lexical-only Hit@1
  # plateauing at 74.3% on natural-language phrasings vs 98.6% on
  # author-curated triggers — a 24-point gap. Fastembed is expected to close
  # the abbreviation / paraphrase mismatches that lexical structurally
  # cannot ("FLS" ↔ "field-level security", "X is slow" ↔
  # "performance issues with X").
  #
  # Backends:
  # - fastembed  → real semantic embeddings
  # - hash       → deterministic token-hashing, no semantic signal (test-only)
  enabled: false
  backend: fastembed
  dimensions: 384
  # Skill count thresholds for embedding adoption
  warn_threshold: 300     # log warning when corpus exceeds this
  require_threshold: 500  # consider required at this size

retrieval:
  lexical_limit: 30
  vector_rerank_limit: 15
  result_limit: 10
  snippet_length: 220
  # Skills scoring below this threshold are suppressed from results and
  # has_coverage is set to false. Consumers should fall back to official_sources
  # only when has_coverage is false rather than presenting a low-confidence skill.
  min_skill_score: 1.5

# Pairwise duplicate detection — used by:
#   - scripts/audit_duplicates.py        (on-demand top-N report)
#   - pipelines/validators.py            (WARN gate inside validate_repo.py)
#   - scripts/new_skill.py --strict      (blocks scaffolding of near-duplicates)
#
# `score` is the minimum combined weighted similarity for a pair to surface.
# `weights` blend three signals — each is a [0, 1] sub-score, weights sum to 1.
#
# Tuned on the 926-skill corpus on 2026-05-01:
#   0.65 → 0 pairs flagged (too aggressive — misses real cases)
#   0.50 → 4 pairs (recommended default — catches genuine overlaps without
#                   flooding on intentional cross-vendor parallels like
#                   bitbucket-pipelines vs gitlab-ci vs github-actions)
#   0.45 → 8 pairs (includes intentional parallels — too noisy as a gate)
duplicate_threshold:
  score: 0.50
  weights:
    description: 0.5  # SequenceMatcher.ratio() on normalized descriptions
    tags: 0.25        # Jaccard over normalized tag sets
    triggers: 0.25    # Jaccard over tokenized trigger words (>= 5 chars)
