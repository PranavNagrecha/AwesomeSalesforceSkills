version: 1

embeddings:
  # Real semantic embeddings via fastembed (BAAI/bge-small-en-v1.5, 384-dim,
  # MIT, ONNX-q on CPU). Enabled by default since the 2026-05-09 benchmark.
  #
  # Measured on 2026-05-09 with a full chunk-level encode (126,618 chunks,
  # 2:20 to build, ~500 MB embeddings.jsonl, gitignored):
  #   curated baseline (1,285 author-curated triggers):
  #     lexical-only:  Hit@1 = 98.6%
  #     +embeddings:   Hit@1 = 98.6%   (no regression, sacred floor held)
  #   natural-language audit (1,418 generated symptom/goal/error queries):
  #     lexical-only:  Hit@1 = 74.3%   Hit@3 = 86.0%
  #     +embeddings:   Hit@1 = 74.5%   Hit@3 = 87.8%   (+1.8pp Hit@3)
  #   realistic-query smoke (71 hand-crafted real-user phrasings):
  #     lexical+sec.:  Hit@1 = 78.9%   Hit@3 = 94.4%
  #     +embeddings:   Hit@1 = 78.9%   Hit@3 = 94.4%   (no movement —
  #                    realistic queries already hit lexical sweet spot)
  #
  # Vector weight tuned in pipelines/ranking.rerank_results to 0.2 — at 0.35
  # NL Hit@1 regressed -4pp (vector noise overwhelmed lexical signal); at
  # 0.10 there was no measurable lift. 0.2 is the sweet spot: curated stays
  # at 98.6%, NL Hit@3 lifts, no regression on realistic phrasings.
  #
  # Backends:
  # - fastembed  → real semantic embeddings (current default)
  # - hash       → deterministic token-hashing, no semantic signal (test-only)
  #
  # First-time build is ~2:20 on M-series CPU. Subsequent builds use the
  # content_hash cache and only re-encode changed chunks. The pre-commit
  # hook explicitly skips embeddings via --skip-embeddings (see
  # .githooks/pre-commit) so day-to-day commits stay sub-second.
  enabled: true
  backend: fastembed
  dimensions: 384
  # Skill count thresholds for embedding adoption
  warn_threshold: 300     # log warning when corpus exceeds this
  require_threshold: 500  # consider required at this size

retrieval:
  lexical_limit: 30
  vector_rerank_limit: 15
  result_limit: 10
  snippet_length: 220
  # Coverage gate. A skill is kept when EITHER threshold is met:
  #   max_score >= min_skill_max_score  OR  score >= min_skill_score
  # Consumers should fall back to official_sources only when has_coverage is
  # false rather than presenting a low-confidence skill.
  #
  # `score` is the CUMULATIVE sum of every chunk a skill contributed; `max_score`
  # is its single best chunk. Gating on `score` alone rewards breadth of weak
  # matches and suppresses one precise match — the units the ranker sorts on
  # (max_score) and the units the gate read (score) had drifted apart. The OR
  # form was swept on 2026-07-31 and is strictly dominant:
  #   score >= 1.5 alone:            fixture Hit@1 94.8%  Hit@3 98.0%
  #                                  fixture false-NONE 3, held-out NONE 23.3%
  #   max >= 1.0 OR score >= 1.5:    fixture Hit@1 95.0%  Hit@3 98.8%
  #                                  fixture false-NONE 0, held-out NONE  6.7%
  # max_score alone at 1.5/1.2/1.0/0.8 all regress Hit@3 to 94.5% by discarding
  # the cumulative signal — the OR keeps both.
  min_skill_score: 1.5
  min_skill_max_score: 1.0
  # Skill-centrality signal. Chunk-level lexical scoring cannot tell "this skill
  # is ABOUT X" from "this skill MENTIONS X", so niche/adjacent skills outranked
  # foundational ones ("create a validation rule" returned data/data-migration-
  # planning). pipelines/ranking.aggregate_skill_scores adds
  #   rank_score = max_score
  #              + name_match_weight        * (query tokens matched in the name)
  #              + description_match_weight * (query tokens matched in the description)
  # This is a RANKING signal only — the coverage gate above still reads
  # max_score/score, so the bonus can reorder results but never manufacture
  # confidence. Swept on 2026-07-31 against a 20-query hand-labeled held-out set
  # plus a 400-fixture sample:
  #   baseline (max_score only): fixture H@1 95.0%  held-out H@1 50.0%  H@3 60.0%
  #   name 1.5 / desc 0.5:       fixture H@1 95.5%  held-out H@1 65.0%  H@3 75.0%
  #   name 2.0 / desc 1.0:       fixture H@1 94.0%  held-out H@1 65.0%  H@3 75.0%
  #   name 3.0 / desc 1.0:       fixture H@1 93.0%  held-out H@1 60.0%  H@3 75.0%
  # Weights above ~2.0 erode the fixture floor; 1.5/0.5 is the knee.
  name_match_weight: 1.5
  description_match_weight: 0.5

# Pairwise duplicate detection — used by:
#   - scripts/audit_duplicates.py        (on-demand top-N report)
#   - pipelines/validators.py            (WARN gate inside validate_repo.py)
#   - scripts/new_skill.py --strict      (blocks scaffolding of near-duplicates)
#
# `score` is the minimum combined weighted similarity for a pair to surface.
# `weights` blend three signals — each is a [0, 1] sub-score, weights sum to 1.
#
# Tuned on the 926-skill corpus on 2026-05-01:
#   0.65 → 0 pairs flagged (too aggressive — misses real cases)
#   0.50 → 4 pairs (recommended default — catches genuine overlaps without
#                   flooding on intentional cross-vendor parallels like
#                   bitbucket-pipelines vs gitlab-ci vs github-actions)
#   0.45 → 8 pairs (includes intentional parallels — too noisy as a gate)
duplicate_threshold:
  score: 0.50
  weights:
    description: 0.5  # SequenceMatcher.ratio() on normalized descriptions
    tags: 0.25        # Jaccard over normalized tag sets
    triggers: 0.25    # Jaccard over tokenized trigger words (>= 5 chars)
