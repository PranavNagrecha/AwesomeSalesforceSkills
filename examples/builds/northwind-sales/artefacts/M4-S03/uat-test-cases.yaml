# UAT test-case pack - Northwind Enterprise sales process
# Compiled by agents/build-doc-keeper's M4-S03 compile run.
# Record shape: skills/admin/uat-test-case-design/references/worked-examples.md section 4.
# One case per manual acceptance test plan.json declares on a step or a milestone (48), plus one per open item in
# decisions.md whose close condition is a human check and that no manual test already covers. Steps on the 48
# manual-test cases are the test's own Then clause, split on its own boundaries; nothing is padded. Where a test
# cannot be ticked as written, the gap is named in `gap` and the pass rule says the gate resolves it first.
# Every ac_id resolves to a criterion in acceptance-criteria.md beside this file.
# Incremental re-run: TC-M4-S04-T7..T11 are the five manual tests plan.json steps[M4-S04].amendments[0] added;
# TC-M4-S02-T6, TC-M4-S03-T6 and TC-M4-S04-T5 follow their amended text. No other case changed.
# Final re-run: plan.json steps[M4-S04].amendments[2] (2026-10-02T19:17:05Z) split compound tests 10 and 11 into tests
# 10-13 and moved tests 8, 9, 10 and 12 to UAT after the first deploy; M4-S04 is now documented. Case ids follow the
# 13-test numbering and no criterion id moved (AC-017.2 stays on test 10, AC-018.2 on test 12). TC-O-M4S04-01..03 are
# M4-S04's open items that need a human check; its other open items are dispositioned at the end.
project: "Northwind Enterprise sales process - build northwind-sales (design-only, scale project)"
sandbox: "UNVERIFIED (2026-10-02): no UAT sandbox or target org is named in plan.json"
run_context:
  build: "northwind-sales; milestones M1-M3 approved, M4 pending"
  sandbox: "UNVERIFIED (2026-10-02): not named in plan.json; org evidence so far is checkOnly against alias sfskills-dev (reports/MOCK-DEPLOY-M1.md to -M4.md)"
  ui: "Lightning Experience; the Enterprise record page targets formFactor Large and Small (M3-S05)"
  personas:
    P-REP: "P-REP - Enterprise rep: profile Sales User with the org's Sales Cloud permission set (Q19) plus the Enterprise_Sales_Record_Types permission set (M2-S02); role Enterprise Rep; does not hold Sales_Ops_Validation_Bypass"
    P-MGR: "P-MGR - Enterprise manager: profile Sales User with the org's Sales Cloud permission set plus Enterprise_Sales_Record_Types; role Enterprise Manager (above Enterprise Rep, Q19); member of the Enterprise_Managers public group"
    P-OPS: "P-OPS - the sales-ops admin seat holding the Sales_Ops_Validation_Bypass permission set (the one person Q13 allows past the rules); its profile is recorded in permission_setup"
    REVIEWER: "Build reviewer at a milestone gate - no Salesforce seat; the oracle is a build file"
  administrator_seat_note: "Q19 records the P-OPS seat as the org administrator profile. Every P-OPS case is paired with a P-REP control so a pass is attributable to Sales_Ops_Validation_Bypass and not to the profile."
negative_path_rule: "negative_path is true only when the pass condition requires confirming that the delivered configuration blocks, omits or excludes a wrong state; a document that merely states a caution is not negative. Most negatives on manual-test cases are document-level exclusions, not functional denials."
