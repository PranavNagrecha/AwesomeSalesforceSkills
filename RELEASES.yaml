# RELEASES.yaml — the release plan and the orchestrator's state.
#
# Machine-read by the always-on orchestration loop and by tests/test_releases.py.
# Owner asks land in `inbox` and are slotted by size. Status moves only with
# evidence (a commit sha, a test line, a measured number). Not a report.
#
# Size vocabulary (owner asks and items): S < 1 agent-hour · M <= 1 agent-day · L multi-day
# (L is split into tracer-bullet items before it is scheduled).
# Slotting: S -> current release if before freeze, else next. M -> current if >= 5 days to
# freeze and capacity, else next. L -> next release, split. A correction of a mistake in
# progress (gate fix, factual error in a shipped skill) may land after freeze.
#
# Job types for skill work:
#   full   — below-bar skill: claims-audit-first rewrite to the 12-signal bar (Opus writer).
#   topup  — at-bar skill: Questions table (exact heading + header row), salesforce-version
#            set from the cited guide, UNVERIFIED burn-down where the corpus can ground.
#   review — one Opus adversarial reviewer per writer batch, before merge.
# KPIs recorded per release in `measured`: questions_tables, at_bar, unverified_markers,
# default_version_skills, fixture_hit1, heldout_hit3, eval_pass_rate.

